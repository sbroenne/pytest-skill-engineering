[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "pytest-skill-engineering-dogfood"
version = "0.1.0"
description = "A historical skill-removal case study with real customer workflows."
requires-python = ">=3.11"
dependencies = ["pytest-skill-engineering>=1.0.0,<2"]

[tool.uv.sources]
pytest-skill-engineering = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/skill_dogfood"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/offline"]
markers = [
    "copilot: explicitly invoked tests that consume real Copilot requests",
    "skill: companion skill behavior",
]
