[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "pytest-copilot"
version = "2.0.0"
description = "Run GitHub Copilot tasks in pytest. Check results with your own assertions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Stefan Brunner" }
]
keywords = ["pytest", "copilot", "ai", "llm", "mcp", "testing", "agents", "skills", "custom-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=9.2.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "python-frontmatter>=1.3.0",
    "github-copilot-sdk>=1.0.28",
    "httpx>=0.28.1",
    "trio>=0.34.0",
    "tomlkit>=0.15.2",
    "pytest-asyncio>=1.4.1",
    "websockets>=17.3",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.3",
    "pyright>=1.1.414",
    "pre-commit>=4.7.0",
    "typeguard>=4.6.0",
]
test = [
    "syrupy>=6.1.1,<7",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7,<9.9",
    "mkdocstrings[python]>=1.0.8",
    "pillow>=13.0.0",
    "cairosvg>=2.9.1",
]

[project.scripts]
pytest-copilot = "pytest_copilot.onboarding:main"

[project.entry-points.pytest11]
aitest = "pytest_copilot.plugin"

[project.urls]
Homepage = "https://github.com/sbroenne/pytest-copilot"
Repository = "https://github.com/sbroenne/pytest-copilot"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_copilot"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
    "src/pytest_copilot/**/*.py",
    "src/pytest_copilot/**/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.ruff.lint.per-file-ignores]
# Test harnesses have long tool descriptions for LLM readability
"src/pytest_copilot/testing/*.py" = ["E501"]
# Test files have long descriptions and variable declarations
"tests/**/*.py" = ["E402", "E501", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests", "examples/skill-dogfood", "examples/excel-skill-value"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Suppress third-party deprecation warnings we can't fix
filterwarnings = [
    "ignore:enable_cleanup_closed:DeprecationWarning:aiohttp",
]
# pytest-copilot configuration for this project's own tests.
# This demonstrates the recommended setup - configure once in pyproject.toml.
# LLM auth is handled by the GitHub Copilot SDK (gh auth login or GITHUB_TOKEN)
addopts = """
--strict-markers
"""
markers = [
    "integration: marks tests as integration tests (require LLM credentials)",
    "aitest: AI agent tests",
    "basic: basic usage tests (banking and todo)",
    "model: tests with multiple models",
    "sysprompt: tests with multiple system prompts",
    "matrix: model × prompt cross-product tests",
    "skill: tests with skills",
    "session_test: multi-turn session tests",
    "clarification: clarification detection tests",
    "iterations: iteration reliability tests",
    "abtest: A/B server comparison tests",
    "cli: command-line tool tests",
    "copilot: marks tests as requiring GitHub Copilot SDK credentials",
    "slow: marks tests as slow/expensive (skipped by default, opt-in with --run-slow)",
]

# UV/PEP 735 dependency groups (for uv sync)
[dependency-groups]
dev = [
    "pytest-copilot[dev,test,docs]",
    "pytest-copilot-dogfood",
]

[tool.uv.sources]
pytest-copilot-dogfood = { path = "examples/skill-dogfood", editable = true }
