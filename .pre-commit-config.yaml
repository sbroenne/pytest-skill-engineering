repos:
  - repo: local
    hooks:
      - id: ruff
        name: "Lint ❌"
        entry: uv run --frozen ruff check
        language: system
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        name: "Format"
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]

      - id: pyright
        name: "Type Check ❌"
        entry: uv run --frozen pyright
        language: system
        types: [python]
        pass_filenames: false

  # Docs: MkDocs build (via uv)
  - repo: local
    hooks:
      - id: mkdocs-build
        name: "Docs Build"
        entry: uv run --frozen python -X utf8 -m mkdocs build --strict
        language: system
        files: ^(docs/|mkdocs\.yml|src/pytest_skill_engineering/)
        pass_filenames: false

# Note: CodeQL ❌ runs on GitHub Actions (not pre-commit)
# See: .github/workflows/codeql.yml
