name: Auto Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Patch release after Dependabot merge
    runs-on: ubuntu-latest
    # Only trigger when dependabot merges a dependency update
    if: |
      github.actor == 'dependabot[bot]' ||
      startsWith(github.event.head_commit.message, 'chore(deps):') ||
      startsWith(github.event.head_commit.message, 'chore(deps-dev):')
    permissions:
      actions: write
    steps:
      - name: Trigger patch release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: {
                version_bump: 'patch'
              }
            });
            console.log(`Triggered patch release for commit: ${context.sha.substring(0, 7)}`);
