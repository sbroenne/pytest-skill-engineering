name: Deploy Documentation

on:
  workflow_call:
    inputs:
      version:
        description: "Version tag (e.g. v0.6.19) to validate and build from"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.6.19) to validate and build from"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.version != '' && inputs.version || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate checked-out docs source version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          uv run python <<'PY'
          from __future__ import annotations

          import os
          import tomllib
          from pathlib import Path

          input_version = os.environ.get("INPUT_VERSION", "").strip()
          ref_name = os.environ.get("GITHUB_REF_NAME", "").strip()
          ref_type = os.environ.get("GITHUB_REF_TYPE", "").strip()

          expected_tag = input_version or (ref_name if ref_type == "tag" and ref_name.startswith("v") else "")
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          source_version = str(pyproject["project"]["version"])

          if expected_tag:
              expected_version = expected_tag.removeprefix("v")
              if source_version != expected_version:
                  raise SystemExit(
                      f"Documentation source drift: checked-out ref declares {source_version}, "
                      f"expected {expected_version} from {expected_tag}"
                  )
              print(f"Validated documentation source for {expected_tag}")
          else:
              print(f"Validated documentation source version {source_version}")
          PY

      - name: Install dependencies
        run: uv sync --extra docs

      - name: Build documentation
        run: uv run mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
