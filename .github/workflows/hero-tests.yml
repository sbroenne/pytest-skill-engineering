name: Hero Tests

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  checks: write
  pull-requests: write

concurrency:
  group: hero-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hero-tests:
    name: Hero Tests (Azure OpenAI)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-hero-tests')
    environment: hero-tests

    env:
      AZURE_API_BASE: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run hero tests
        run: |
          uv run pytest tests/showcase/ -v \
            --aitest-html=docs/demo/hero-report.html \
            --junitxml=hero-results.xml \
            -o "addopts=--aitest-summary-model=copilot/gpt-5.5"

      - name: Publish JUnit results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: always()
        with:
          name: Hero Test Results
          path: hero-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: hero-report
          path: |
            docs/demo/hero-report.html
            aitest-reports/results*.json

      - name: Commit updated hero report
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        if: always()
        with:
          commit_message: "ci: update hero report [skip ci]"
          file_pattern: docs/demo/hero-report.html

      - name: Remove trigger label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.label.name == 'run-hero-tests'
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'run-hero-tests'
            });
