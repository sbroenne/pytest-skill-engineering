name: Hero Tests

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write
  checks: write
  pull-requests: write

concurrency:
  group: hero-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hero-tests:
    name: Hero Tests (Copilot)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-hero-tests')
    environment: hero-tests

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run hero tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python -m pytest tests/showcase/ -v \
            --aitest-html=docs/demo/hero-report.html \
            --junitxml=hero-results.xml \
            -o "addopts=--aitest-summary-model=copilot/gpt-5.5"

      - name: Publish JUnit results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: always()
        with:
          name: Hero Test Results
          path: hero-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: hero-report
          path: |
            docs/demo/hero-report.html
            aitest-reports/results*.json

      - name: Commit updated hero report
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        if: success()
        with:
          commit_message: "ci: update hero report [skip ci]"
          file_pattern: docs/demo/hero-report.html

      - name: Remove trigger label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.label.name == 'run-hero-tests'
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'run-hero-tests'
            });
