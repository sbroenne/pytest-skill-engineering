name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        default: 'patch'
        options:
          - major
          - minor
          - patch
      custom_version:
        description: 'Custom version (e.g., 1.2.3, overrides version_bump)'
        required: false
        type: string

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calculate_version.outputs.version }}
      tag: ${{ steps.calculate_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history and tags

      - name: Calculate version
        id: calculate_version
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          python <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          import tomllib
          from pathlib import Path


          def parse_semver(version: str) -> tuple[int, int, int]:
              parts = version.strip().split(".")
              if len(parts) != 3 or any(not part.isdigit() for part in parts):
                  msg = (
                      "release.yml only supports plain semver X.Y.Z for automatic "
                      f"version calculation, got {version!r}. Use custom_version for "
                      "pre-releases or other custom versions."
                  )
                  raise SystemExit(msg)
              return tuple(int(part) for part in parts)


          custom_version = os.environ.get("CUSTOM_VERSION", "").strip()
          if custom_version:
              version = custom_version
              print(f"Using custom version: {version}")
          else:
              pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
              pyproject_version = str(pyproject["project"]["version"])
              tag_versions = [
                  tag.removeprefix("v")
                  for tag in subprocess.run(
                      ["git", "tag", "--list", "v*"],
                      check=True,
                      capture_output=True,
                      text=True,
                  ).stdout.splitlines()
                  if tag.strip()
              ]
              if tag_versions:
                  tag_version = max(tag_versions, key=parse_semver)
                  latest_tag = f"v{tag_version}"
              else:
                  latest_tag = "v0.0.0"
                  tag_version = "0.0.0"

              print(f"Latest tag: {latest_tag}")
              print(f"pyproject.toml version: {pyproject_version}")

              tag_semver = parse_semver(tag_version)
              pyproject_semver = parse_semver(pyproject_version)
              bump = os.environ["VERSION_BUMP"]

              if pyproject_semver > tag_semver:
                  version = pyproject_version
                  print(
                      "pyproject.toml is ahead of the latest tag; "
                      f"releasing {version} as-is."
                  )
              else:
                  major, minor, patch = tag_semver
                  if bump == "major":
                      version = f"{major + 1}.0.0"
                  elif bump == "minor":
                      version = f"{major}.{minor + 1}.0"
                  elif bump == "patch":
                      version = f"{major}.{minor}.{patch + 1}"
                  else:
                      raise SystemExit(f"Unsupported version bump: {bump}")

                  print(f"Calculated new version from tag: {version}")

          tag = f"v{version}"
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag={tag}\n")
          PY

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Update version in pyproject.toml
        run: |
          sed -i 's/^version = ".*"/version = "${{ needs.version.outputs.version }}"/' pyproject.toml
          echo "Updated version to ${{ needs.version.outputs.version }}"
          grep "^version" pyproject.toml

      - name: Install build dependencies
        run: uv sync --dev

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test:
    name: Test Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package from wheel
        run: pip install dist/*.whl

      - name: Verify installation
        run: |
          python -c "from pytest_skill_engineering import plugin; print('Import successful')"

  create-tag:
    name: Create Git Tag
    runs-on: ubuntu-latest
    needs: [version, build, test]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          echo "Creating tag: $TAG"
          
          # Check if tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi
          
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, test, create-tag]
    environment:
      name: pypi
      url: https://pypi.org/project/pytest-skill-engineering/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, publish-pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.version.outputs.tag, 'alpha') || contains(needs.version.outputs.tag, 'beta') || contains(needs.version.outputs.tag, 'rc') }}

  deploy-docs:
    name: Deploy Documentation
    needs: [version, github-release]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ needs.version.outputs.tag }}
