name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        default: 'patch'
        options:
          - major
          - minor
          - patch
      custom_version:
        description: 'Custom version (e.g., 1.2.3, overrides version_bump)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calculate_version.outputs.version }}
      tag: ${{ steps.calculate_version.outputs.tag }}
      tag_exists: ${{ steps.calculate_version.outputs.tag_exists }}
      pypi_exists: ${{ steps.calculate_version.outputs.pypi_exists }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0  # Fetch all history and tags

      - name: Calculate version
        id: calculate_version
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          python <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          import tomllib
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen


          def parse_semver(version: str) -> tuple[int, int, int]:
              parts = version.strip().split(".")
              if len(parts) != 3 or any(not part.isdigit() for part in parts):
                  msg = (
                      "release.yml only supports plain semver X.Y.Z for automatic "
                      f"version calculation, got {version!r}. Use custom_version for "
                      "pre-releases or other custom versions."
                  )
                  raise SystemExit(msg)
              return tuple(int(part) for part in parts)


          def git(*args: str) -> str:
              return subprocess.run(
                  ["git", *args],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()


          def pypi_version_exists(package: str, version: str) -> bool:
              url = f"https://pypi.org/pypi/{package}/{version}/json"
              try:
                  with urlopen(url, timeout=10) as response:
                      return response.status == 200
              except HTTPError as exc:
                  if exc.code == 404:
                      return False
                  raise
              except URLError as exc:
                  raise SystemExit(f"Unable to query PyPI for {package} {version}: {exc}") from exc


          custom_version = os.environ.get("CUSTOM_VERSION", "").strip()
          head_sha = git("rev-parse", "HEAD")
          head_tag_versions = [
              tag.removeprefix("v")
              for tag in git("tag", "--points-at", "HEAD", "--list", "v*").splitlines()
              if tag.strip()
          ]

          if custom_version:
              version = custom_version
              print(f"Using custom version: {version}")
          elif head_tag_versions:
              version = max(head_tag_versions, key=parse_semver)
              print(
                  "HEAD already has a semver tag; rerun detected. "
                  f"Reusing existing version {version}."
              )
          else:
              pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
              pyproject_version = str(pyproject["project"]["version"])
              tag_versions = [
                  tag.removeprefix("v")
                  for tag in git("tag", "--list", "v*").splitlines()
                  if tag.strip()
              ]
              if tag_versions:
                  tag_version = max(tag_versions, key=parse_semver)
                  latest_tag = f"v{tag_version}"
              else:
                  latest_tag = "v0.0.0"
                  tag_version = "0.0.0"

              print(f"Latest tag: {latest_tag}")
              print(f"pyproject.toml version: {pyproject_version}")

              tag_semver = parse_semver(tag_version)
              pyproject_semver = parse_semver(pyproject_version)
              bump = os.environ["VERSION_BUMP"]

              if pyproject_semver > tag_semver:
                  version = pyproject_version
                  print(
                      "pyproject.toml is ahead of the latest tag; "
                      f"releasing {version} as-is."
                  )
              else:
                  major, minor, patch = tag_semver
                  if bump == "major":
                      version = f"{major + 1}.0.0"
                  elif bump == "minor":
                      version = f"{major}.{minor + 1}.0"
                  elif bump == "patch":
                      version = f"{major}.{minor}.{patch + 1}"
                  else:
                      raise SystemExit(f"Unsupported version bump: {bump}")

                  print(f"Calculated new version from tag: {version}")

          tag = f"v{version}"
          tag_exists = subprocess.run(
              ["git", "rev-parse", "--verify", f"refs/tags/{tag}"],
              check=False,
              capture_output=True,
              text=True,
          ).returncode == 0

          if tag_exists:
              tag_sha = git("rev-list", "-n", "1", tag)
              print(f"Tag {tag} already exists on commit {tag_sha}")
              if tag_sha != head_sha:
                  raise SystemExit(
                      f"Target tag {tag} already exists on commit {tag_sha}, "
                      f"but workflow is running on {head_sha}. "
                      "Use a different version or run from the tagged commit."
                  )
          else:
              print(f"Tag {tag} does not exist yet")

          pypi_exists = pypi_version_exists("pytest-skill-engineering", version)
          print(f"PyPI already has pytest-skill-engineering {version}: {pypi_exists}")

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag={tag}\n")
              output.write(f"tag_exists={str(tag_exists).lower()}\n")
              output.write(f"pypi_exists={str(pypi_exists).lower()}\n")
          PY

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Update version in pyproject.toml
        run: |
          sed -i 's/^version = ".*"/version = "${{ needs.version.outputs.version }}"/' pyproject.toml
          echo "Updated version to ${{ needs.version.outputs.version }}"
          grep "^version" pyproject.toml

      - name: Install build dependencies
        run: uv sync --dev

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  test:
    name: Test Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install package from wheel
        run: pip install dist/*.whl

      - name: Verify installation
        run: |
          python -c "from pytest_skill_engineering import plugin; print('Import successful')"

  create-tag:
    name: Create Git Tag
    runs-on: ubuntu-latest
    needs: [version, build, test]
    if: ${{ needs.version.outputs.tag_exists != 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          echo "Creating tag: $TAG"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [version, build, test, create-tag]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.test.result == 'success' && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped') && needs.version.outputs.pypi_exists != 'true' }}
    environment:
      name: pypi
      url: https://pypi.org/project/pytest-skill-engineering/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build, publish-pypi]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          release_args=(--generate-notes --title "$TAG")
          case "$TAG" in
            *alpha*|*beta*|*rc*)
              release_args+=(--prerelease)
              ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; refreshing attached artifacts"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* "${release_args[@]}"
          fi

  deploy-docs:
    name: Deploy Documentation
    needs: [version, github-release]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ needs.version.outputs.tag }}
